global:
  scrape_interval: 5s
scrape_configs:
  - job_name: shop
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # catalog-service
          - host.docker.internal:8082   # order-service
          - host.docker.internal:8083   # payment-service
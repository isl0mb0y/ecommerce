server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: catalog
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**
        - id: orders
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**
        - id: payments
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:3000"
            allowed-methods: GET, POST, PUT, DELETE, OPTIONS
            allowed-headers: "*"
            max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health, gateway
  endpoint:
    gateway:
      enabled: true
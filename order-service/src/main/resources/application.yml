server:
  port: 8082
  error:
    include-message: always
  tomcat:
    threads:
      max: 10   # learning: small pool to reproduce thread starvation

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: shop
    password: shop
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost

catalog:
  base-url: http://localhost:8081
  connect-timeout-ms: 500
  read-timeout-ms: 2000

logging:
  level:
    com.shop: INFO

resilience4j:
  retry:
    instances:
      catalog:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health, retries, retryevents






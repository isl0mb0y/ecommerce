server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: shop
    password: shop
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: localhost

logging:
  level:
    com.shop: INFO
  pattern:
    level: "%5p [%X{requestId:-},%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus      # mavjud ro'yxat bo'lsa, oxiriga prometheus qo'shing
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
